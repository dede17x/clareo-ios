name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-unsigned:
    name: Unsigned simulator build (sanity check, no secrets needed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Clareo.xcodeproj \
            -scheme Clareo \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
